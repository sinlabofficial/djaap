[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "djantra"
version = "0.1.0"
description = "Django full-stack webapp starterkit"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Developer", email = "dev@example.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "django>=6.1,<6.2",
    "psycopg[binary]>=3.1",
    "gunicorn>=22.0",
    "whitenoise>=6.6",
    "goodconf>=6.0",
    "django-alive>=1.1",
    "django-cors-headers>=4.3",
    "httpx>=0.27",
    "dj-database-url>=2.1",
    "django-safedelete>=1.3",
    "django-auditlog>=2.2",
    "django-impersonate>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.7",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "pytest-socket>=0.6",
    "pytest-env>=1.1",
    "factory-boy>=3.3",
    "ruff>=0.3",
    "mypy>=1.9",
    "django-stubs>=4.2",
    "pre-commit>=3.6",
    "django-coverage-plugin>=3.2.2",
]
api = [
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
]

[project.scripts]
manage = "backend.manage:main"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--disable-socket",
    "--allow-unix-socket",
    "--reuse-db",
    "--cov=backend/apps",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
    "-n=auto",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "asyncio: marks tests as async",
]

[tool.coverage.run]
source = ["backend/apps", "backend/tests"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/config/*",
    "*/templates/*",
]
plugins = ["django_coverage_plugin"]

[tool.coverage.report]
fail_under = 80
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "migrations",
    "tests",
]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warnings
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM",# flake8-simplify
]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["backend", "apps"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
