<div class="grid gap-6 pb-24 xl:grid-cols-[minmax(0,1fr)_24rem]">
    <section class="space-y-6">
        <div>
            <h1 class="text-2xl font-bold text-on-surface">Roles</h1>
            <p class="mt-1 text-sm text-on-surface-variant">Manage global roles and their associated permissions.</p>
        </div>
        {% if request.user.is_staff %}<div class="flex gap-2"><a href="{% url 'dashboard:permission_list' %}" class="rounded-lg border border-outline px-4 py-2 text-xs font-bold uppercase tracking-widest text-on-surface-variant">Permissions</a><button type="button" hx-get="{% url 'dashboard:role_create' %}" hx-target="#role-detail-panel" hx-swap="innerHTML" class="rounded-lg bg-primary px-4 py-2 text-xs font-bold uppercase tracking-widest text-on-primary">Create role</button></div>{% endif %}

        <div id="roles-table-region" hx-get="{% url 'dashboard:roles_table' %}" hx-trigger="rolesChanged from:body" hx-swap="innerHTML">
            {% include "pages/roles_table.html" %}
        </div>
    </section>

    <aside id="role-detail-panel" class="xl:sticky xl:top-20 xl:self-start">
        {% include "pages/role_detail_empty.html" %}
    </aside>
</div>
