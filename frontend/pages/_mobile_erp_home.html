<div class="min-w-0 space-y-5" data-testid="mobile-erp-home">
    <header data-testid="mobile-erp-hero" class="min-w-0">
        <h1 class="text-3xl font-semibold tracking-tight text-on-surface">Dashboard</h1>
        <p class="mt-2 text-sm leading-6 text-on-surface-variant">Your organization at a glance. Choose a module to get started.</p>
    </header>

    <section aria-labelledby="mobile-modules-heading" class="min-w-0">
        <h2 id="mobile-modules-heading" class="mb-3 text-base font-semibold text-on-surface">Your modules</h2>
        <nav data-testid="mobile-app-launcher" aria-label="ERP Modules" class="grid min-w-0 grid-cols-2 gap-3 sm:grid-cols-3">
            {% if request.user.is_staff %}
            <a href="{% url 'dashboard:user_list' %}" class="flex min-h-20 min-w-0 flex-col items-start justify-center gap-2 rounded-lg border border-outline-variant bg-surface-container-lowest p-4 text-sm font-medium text-on-surface transition-colors hover:border-primary hover:bg-surface-container-low focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface">
                <i data-lucide="users" class="h-5 w-5 text-primary" aria-hidden="true"></i>
                <span>Users</span>
            </a>
            <a href="{% url 'dashboard:role_list' %}" class="flex min-h-20 min-w-0 flex-col items-start justify-center gap-2 rounded-lg border border-outline-variant bg-surface-container-lowest p-4 text-sm font-medium text-on-surface transition-colors hover:border-primary hover:bg-surface-container-low focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface">
                <i data-lucide="shield-check" class="h-5 w-5 text-primary" aria-hidden="true"></i>
                <span>Roles</span>
            </a>
            <a href="{% url 'dashboard:logs' %}" class="flex min-h-20 min-w-0 flex-col items-start justify-center gap-2 rounded-lg border border-outline-variant bg-surface-container-lowest p-4 text-sm font-medium text-on-surface transition-colors hover:border-primary hover:bg-surface-container-low focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface">
                <i data-lucide="scroll-text" class="h-5 w-5 text-primary" aria-hidden="true"></i>
                <span>Audit logs</span>
            </a>
            {% endif %}
            <a href="{% url 'dashboard:profile' %}" class="flex min-h-20 min-w-0 flex-col items-start justify-center gap-2 rounded-lg border border-outline-variant bg-surface-container-lowest p-4 text-sm font-medium text-on-surface transition-colors hover:border-primary hover:bg-surface-container-low focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface">
                <i data-lucide="user-round" class="h-5 w-5 text-primary" aria-hidden="true"></i>
                <span>Profile</span>
            </a>
            {% if request.user.is_staff %}
            <a href="{% url 'dashboard:settings' %}" class="flex min-h-20 min-w-0 flex-col items-start justify-center gap-2 rounded-lg border border-outline-variant bg-surface-container-lowest p-4 text-sm font-medium text-on-surface transition-colors hover:border-primary hover:bg-surface-container-low focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface">
                <i data-lucide="settings" class="h-5 w-5 text-primary" aria-hidden="true"></i>
                <span>Settings</span>
            </a>
            <a href="{% url 'dashboard:logs' %}?tab=background_jobs" class="flex min-h-20 min-w-0 flex-col items-start justify-center gap-2 rounded-lg border border-outline-variant bg-surface-container-lowest p-4 text-sm font-medium text-on-surface transition-colors hover:border-primary hover:bg-surface-container-low focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface">
                <i data-lucide="list-checks" class="h-5 w-5 text-primary" aria-hidden="true"></i>
                <span>Jobs</span>
            </a>
            {% endif %}
        </nav>
    </section>
</div>
