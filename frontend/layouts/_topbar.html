<header
    class="sticky top-0 z-30 flex items-center justify-between gap-4 w-full h-16 px-4 lg:px-6 bg-surface border-b border-outline-variant"
>
    <!-- Mobile Menu Button -->
    <button
        @click="mobileOpen = !mobileOpen"
        class="lg:hidden p-2 -ml-2 rounded-lg hover:bg-surface-container-low text-on-surface-variant transition-colors"
    >
        <i data-lucide="menu" class="w-5 h-5"></i>
    </button>

    <!-- Sidebar Toggle -->
    <div data-testid="topbar-left-controls" class="flex min-w-0 flex-1 items-center">
        <button
            @click="sidebarCollapsed = !sidebarCollapsed"
            data-testid="topbar-sidebar-toggle"
            class="hidden h-8 w-8 items-center justify-center rounded-lg bg-transparent text-on-surface-variant shadow-none transition-colors hover:bg-transparent hover:text-on-surface hover:shadow-none lg:flex"
            :title="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
            aria-label="Toggle sidebar"
            :aria-expanded="!sidebarCollapsed"
        >
            <i x-show="sidebarCollapsed" data-lucide="chevron-right" class="h-5 w-5"></i>
            <i x-show="!sidebarCollapsed" data-lucide="chevron-left" class="h-5 w-5"></i>
        </button>
    </div>

    <!-- Right Section -->
    <div class="flex items-center gap-2">
        <!-- Notifications -->
        <button
            class="relative p-2 rounded-lg hover:bg-surface-container-low text-on-surface-variant transition-colors"
            title="Notifications"
        >
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-error rounded-full"></span>
        </button>

        <!-- User Profile Dropdown -->
        <div class="relative" x-data="{ open: false }">
            <button
                @click="open = !open"
                @click.away="open = false"
                class="flex items-center gap-3 p-1.5 rounded-lg hover:bg-surface-container-low transition-colors"
            >
                <div class="hidden sm:block text-right">
                    <p class="text-sm font-medium text-on-surface">{{ request.user.get_full_name|default:request.user.email|default:"User" }}</p>
                    <p class="text-xs text-on-surface-variant capitalize">Member</p>
                </div>
                <div class="w-9 h-9 overflow-hidden rounded-full bg-primary-container flex items-center justify-center shrink-0">
                    {% if request.user.profile_photo %}
                    <img src="{{ request.user.profile_photo.url }}" alt="{{ request.user.get_full_name|default:request.user.email }}" class="h-full w-full object-cover">
                    {% else %}
                    <span class="text-sm font-medium text-on-primary-container">{{ request.user.get_full_name|first|upper|default:"U" }}</span>
                    {% endif %}
                </div>
                <i data-lucide="chevron-down" class="hidden sm:block w-4 h-4 text-on-surface-variant transition-transform" :class="open ? 'rotate-180' : ''"></i>
            </button>

            <!-- Dropdown Menu -->
            <div
                x-show="open"
                x-transition:enter="transition ease-out duration-100"
                x-transition:enter-start="transform opacity-0 scale-95"
                x-transition:enter-end="transform opacity-100 scale-100"
                x-transition:leave="transition ease-in duration-75"
                x-transition:leave-start="transform opacity-100 scale-100"
                x-transition:leave-end="transform opacity-0 scale-95"
                class="absolute right-0 mt-2 w-48 bg-surface-container-lowest rounded-lg shadow-lg border border-outline-variant overflow-hidden py-1"
                x-cloak
            >
                <a
                    href="{% url 'dashboard:profile' %}"
                    class="flex items-center gap-2 px-4 py-2 text-sm text-on-surface hover:bg-surface-container-low transition-colors"
                >
                    <i data-lucide="user" class="w-4 h-4"></i>
                    My Profile
                </a>
                <hr class="border-outline-variant my-1">
                <form method="post" action="{% url 'dashboard:logout' %}" class="m-0">
                    {% csrf_token %}
                    <button
                        type="submit"
                        class="w-full flex items-center gap-2 px-4 py-2 text-sm text-error hover:bg-surface-container-low transition-colors text-left"
                    >
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                        Logout
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>
