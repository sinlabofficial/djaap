{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">
    <title>{% block head_title %}djaapp{% endblock %}</title>
    <script>
        (() => {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="{% static 'bundles/main.css' %}">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://unpkg.com/htmx.org@2.0.10"></script>
    <script>
        document.addEventListener("htmx:configRequest", (event) => {
            event.detail.headers["X-CSRFToken"] = document.querySelector('meta[name="csrf-token"]')?.content || "";
        });
    </script>
    <style>[x-cloak] { display: none !important; }</style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-surface text-on-surface font-sans" x-data="{}">
    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
</body>
</html>
